<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Catalog - Pluton Poker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Press Start 2P", monospace;
        background-color: #1a1a2e;
        color: #c0c0d0;
        margin: 0;
        padding: 2em;
        line-height: 1.8;
        font-size: 10px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        color: #88a;
        font-size: 14px;
        margin-bottom: 1.5em;
        text-align: center;
      }

      h2 {
        color: #f4a020;
        font-size: 11px;
        margin-top: 2.5em;
        margin-bottom: 1em;
        border-bottom: 2px solid #2d2d44;
        padding-bottom: 0.5em;
      }

      ul {
        margin: 0.5em 0;
        padding-left: 1.5em;
      }

      li {
        margin: 0.5em 0;
      }

      a {
        color: #c0c0d0;
        text-decoration: none;
      }

      a:hover {
        color: #f4a020;
      }

      @media (min-width: 600px) {
        body {
          font-size: 12px;
          padding: 3em;
        }

        h1 {
          font-size: 16px;
        }

        h2 {
          font-size: 12px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-element/lit-element.js": "/node_modules/lit-element/lit-element.js",
          "lit-html/is-server.js": "/node_modules/lit-html/is-server.js"
        }
      }
    </script>
    <script type="module" src="/catalog-index.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>UI Catalog</h1>

      <h2>Static Pages</h2>
      <ul>
        <li><a href="/about">about</a></li>
        <li><a href="/learn">learn</a></li>
        <li><a href="/release-notes">release-notes</a></li>
      </ul>

      <div id="test-cases"></div>
    </div>
  </body>
</html>
